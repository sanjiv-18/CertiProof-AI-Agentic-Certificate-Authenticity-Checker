version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_SECRET_KEY=production-secret-infinity-castle-2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
      - DATABASE_URL=sqlite:///./certiproof.db
      - SCREENSHOTS_DIR=./screenshots
      - PLAYWRIGHT_HEADLESS=1
    volumes:
      - ./data:/app/data
      - ./screenshots:/app/screenshots
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
